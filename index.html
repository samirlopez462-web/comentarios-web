<!DOCTYPE html>
<html>
<head>
  <title>Comentarios PRO</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    input, textarea { width: 100%; margin-top: 10px; padding: 10px; }
    button { margin-top: 10px; padding: 10px; background: #007bff; color: white; border: none; cursor: pointer; }
    .comentario { background: #eee; margin-top: 10px; padding: 10px; border-radius: 8px; }
  </style>
</head>
<body>

<h1>Comentarios 💬</h1>

<input id="nombre" placeholder="Tu nombre">
<textarea id="mensaje" placeholder="Escribe tu comentario..."></textarea>
<button onclick="enviar()">Enviar</button>

<h2>Comentarios:</h2>
<div id="comentarios"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } 
from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBYe3AympJ0AdP3XOMb0YPJ5-1xx6077FE",
  authDomain: "vlsdigital-sebastian-lopez.firebaseapp.com",
  projectId: "vlsdigital-sebastian-lopez",
  storageBucket: "vlsdigital-sebastian-lopez.firebasestorage.app",
  messagingSenderId: "213168392649",
  appId: "1:213168392649:web:4c09ce0008bd829c910018",
  measurementId: "G-SVX91WK96W"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// enviar comentario
window.enviar = async function () {
  const nombre = document.getElementById("nombre").value;
  const mensaje = document.getElementById("mensaje").value;

  if (!nombre || !mensaje) {
    alert("Completa todo");
    return;
  }

  await addDoc(collection(db, "comments"), {
    nombre,
    mensaje,
    fecha: Date.now()
  });

  document.getElementById("nombre").value = "";
  document.getElementById("mensaje").value = "";
};

// mostrar en tiempo real
const q = query(collection(db, "comments"), orderBy("fecha", "desc"));

onSnapshot(q, (snapshot) => {
  let html = "";
  snapshot.forEach(doc => {
    const data = doc.data();
    html += `
      <div class="comentario">
        <b>${data.nombre}</b><br>
        ${data.mensaje}
      </div>
    `;
  });

  document.getElementById("comentarios").innerHTML = html;
});
</script>

</body>
</html>
